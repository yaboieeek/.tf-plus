
name: Discord Notifications

on:
  push:
    branches: [ main, master ]

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          since_last_remote_commit: true

      - name: Send Discord notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |

          FILES_LIST="${{ steps.changed-files.outputs.all_changed_files }}"
          IFS=' ' read -ra FILES_ARRAY <<< "$FILES_LIST"

          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          AUTHOR_NAME="${{ github.actor }}"

          for file_path in "${FILES_ARRAY[@]}"; do

            if [[ -n "$file_path" ]]; then

              FILENAME=$(basename "$file_path")

              REPO_URL="https://github.com/${{ github.repository }}"
              FILE_URL="$REPO_URL/blob/${{ github.ref_name }}/$file_path"

              TITLE="$FILENAME"

              DESCRIPTION=""
              TIMESTAMP=""

              if [[ "${{ github.event_name }}" == "push" ]]; then

                COMMIT_MESSAGE_RAW="${{ github.event.head_commit.message }}"

                FIRST_LINE=$(echo "$COMMIT_MESSAGE_RAW" | head -n1)
                REST=$(echo "$COMMIT_MESSAGE_RAW" | tail -n+2)

                DESCRIPTION="**$FIRST_LINE**"

                if [[ -n "$REST" ]]; then
                  DESCRIPTION+=$'\n\n'"$REST"
                fi

                TIMESTAMP="${{ github.event.head_commit.timestamp }}"
              fi

              if [[ -z "$TIMESTAMP" ]]; then
                TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              fi

              JSON_PAYLOAD=$(jq -n \
                --arg content "🗣 Update in $REPO_NAME!" \
                --arg title "$TITLE" \
                --arg url "$FILE_URL" \
                --arg description "$DESCRIPTION" \
                --arg branch "$BRANCH_NAME" \
                --arg author "$AUTHOR_NAME" \
                --arg timestamp "$TIMESTAMP" \
                '{
                  content: $content,
                  embeds: [{
                    title: $title,
                    url: $url,
                    description: $description,
                    color: 10181046,
                    fields: [
                      {
                        name: "Branch",
                        value: $branch,
                        inline: true
                      },
                      {
                        name: "Author",
                        value: $author,
                        inline: true
                      }
                    ],
                    timestamp: $timestamp
                  }]
                }')

              echo "$JSON_PAYLOAD"

              curl -H "Content-Type: application/json" \
                -X POST \
                -d "$JSON_PAYLOAD" \
                "$DISCORD_WEBHOOK_URL"

            fi

          done

